[project]
name = "synapse"
version = "0.1.0"
description = "Terminal Pentest Assessment State Machine & Methodology Copilot for eJPT, OSCP, CTFs, and Labs"
readme = "README.md"
authors = [
    { name = "Synapse Developers", email = "security@synapse.local" }
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "textual>=0.70.0",
]

[project.scripts]
synapse = "synapse.cli:main"
syn = "synapse.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
