# Lavoisier target - vsftpd (read-only anonymous drop, intentional dead end)
listen=YES
background=NO
anonymous_enable=YES
local_enable=YES
write_enable=NO
anon_upload_enable=NO
anon_mkdir_write_enable=NO
anon_root=/srv/ftp
ftp_username=ftp
secure_chroot_dir=/usr/share/empty
xferlog_enable=NO
connect_from_port_20=NO
